# POCO X5 Pro 5G (redwood) -- donor-format profile, generated by
# toolkit/tools/conf_bridge.py from toolkit/devices/redwood.json. Edit the JSON, not this file.
# The donor variables come first (common/devices/_template.conf); IOSPORT_* are this port's extensions.

NAME="POCO X5 Pro 5G (redwood)"
KIND=phone
SOC="Qualcomm Snapdragon 778G (SM7325)"
BOOT_VIA=fastboot
UEFI_TARGET=redwood
UEFI_FD=
DTB=
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000
FB_BASE=0xE1000000
WIFI_ATH11K=1
BOOTARGS="touchscreen=1 cpufreq=1 bootcpu=7 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"

# --- this port's extensions (toolkit) ----------------------------------------------------------
IOSPORT_PROFILE=toolkit/devices/redwood.json   # the full profile (every value, with sources)
IOSPORT_ENTRY_METHOD=fastboot-boot   # recovery: write+restore | fastboot-boot: RAM only
IOSPORT_SYSTEM_SOURCES=usb-loader   # where the firmware may take SYSTEM.APF from
IOSPORT_GIC_VTIMER=27   # the kernel needs gic_vtimer= when not 27
IOSPORT_PANEL=1080x2400
