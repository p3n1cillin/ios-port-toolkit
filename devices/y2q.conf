# Samsung Galaxy S20+ 5G (y2q) -- donor-format profile, generated by
# toolkit/tools/conf_bridge.py from toolkit/devices/y2q.json. Edit the JSON, not this file.
# The donor variables come first (common/devices/_template.conf); IOSPORT_* are this port's extensions.
# (the donor runs this phone with KIND=phone BOOT_VIA=twrp; the toolkit does not)

# Guard: this phone is tested from its recovery partition with automatic restore (toolkit/SAFETY.md).
# ./xl and common/run.sh would reboot it to the bootloader for fastboot, or write its boot partition
# from TWRP: refuse them here. common/build.sh (kernel, loader, REST=1 images) is fine.
case "${0##*/}" in
xl|run.sh) echo "y2q: recovery-tested phone; run tests with toolkit/runner (see toolkit/README.md)" >&2; exit 1 ;;
esac

NAME="Samsung Galaxy S20+ 5G (y2q, SM-G986N)"
KIND=phone-recovery
SOC="Qualcomm Snapdragon 865 (SM8250)"
BOOT_VIA=recovery-test
UEFI_TARGET=y2q
UEFI_FD=
DTB=uefi/files/Resources/DTBs/y2q.dtb
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000
FB_BASE=0x9C000000
WIFI_ATH11K=0
BOOTARGS="cpus=8"
DEFAULT_SECS=300
USERLAND_VARS="GL=1"
FIRMWARE=
AUTOBOOT_ARGS="cpus=8 bootcpu=7 touchscreen=1 ufs=2 root_apfs=ufs_darwin sb_delay=8 var_store=1 ufs_write=1 gpu=1 max77705=1 wifi=1"

# --- this port's extensions (toolkit) ----------------------------------------------------------
IOSPORT_PROFILE=toolkit/devices/y2q.json   # the full profile (every value, with sources)
IOSPORT_MODEL=SM-G986N   # the runner refuses any other ro.product.model
IOSPORT_TEST_PARTITION=recovery   # the ONLY partition a test writes
IOSPORT_ENTRY_METHOD=recovery   # recovery: write+restore | fastboot-boot: RAM only
IOSPORT_DOWNLOAD_RESTORE="RECOVERY only (original image, hash-checked)"   # Download Mode
IOSPORT_LOG_RING=0x9F200000   # Samsung RAM ring (/proc/last_kmsg), warm resets keep it
IOSPORT_LOG_SLOT_MAGIC=Y2QLOGSLOT/V1
IOSPORT_USB_MSD_LABEL=Y2QRAM   # the PC copies SYSTEM.APF onto this USB RAM drive
IOSPORT_GIC_VTIMER=27   # the kernel needs gic_vtimer= when not 27
IOSPORT_PANEL=1440x3200
IOSPORT_PANEL_WINDOW="2A:0000059F 2B:00000C7F"   # DCS resent after the DSI reset
IOSPORT_FLIP_BUFFERS="0x9C000000 0x9D200000"
