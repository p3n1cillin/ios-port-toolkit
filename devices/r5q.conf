# Samsung Galaxy S10 Lite (r5q) -- donor-format profile, generated by
# toolkit/tools/conf_bridge.py from toolkit/devices/r5q.json. Edit the JSON, not this file.
# The donor variables come first (common/devices/_template.conf); IOSPORT_* are this port's extensions.

# Guard: this phone is tested from its recovery partition with automatic restore (toolkit/SAFETY.md).
# ./xl and common/run.sh would reboot it to the bootloader for fastboot, or write its boot partition
# from TWRP: refuse them here. common/build.sh (kernel, loader, REST=1 images) is fine.
case "${0##*/}" in
xl|run.sh) echo "r5q: recovery-tested phone; run tests with toolkit/runner (see toolkit/README.md)" >&2; exit 1 ;;
esac

NAME="Samsung Galaxy S10 Lite (r5q, SM-G770F)"
KIND=phone-recovery
SOC="Qualcomm Snapdragon 855 (SM8150)"
BOOT_VIA=recovery-test
UEFI_TARGET=r5qfull
UEFI_FD=work/ios-r5q/port/build/r5q-fulldbg23-uefi.fd
DTB=
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000
FB_BASE=0x9C400000
WIFI_ATH11K=0
BOOTARGS="touchscreen=1 touch_log=1 cpus=8 cpufreq=1 fbscale=2"
DEFAULT_SECS=900
USERLAND_VARS=
FIRMWARE=

# --- this port's extensions (toolkit) ----------------------------------------------------------
IOSPORT_PROFILE=toolkit/devices/r5q.json   # the full profile (every value, with sources)
IOSPORT_MODEL=SM-G770F   # the runner refuses any other ro.product.model
IOSPORT_TEST_PARTITION=recovery   # the ONLY partition a test writes
IOSPORT_RECOVERY_BYTES=82726912   # test images are padded to it
IOSPORT_RECOVERY_SHA256=332e1dd4a1c87bcd929696c5e1aa4f6730795c5de440acface1572ae3ba383cd   # original recovery: restored after every run
IOSPORT_BOOT_SHA256=381e6aa72b0fee42a04c4f7be51d0c63bccaaed26e54f9ac30d3de6255e1bc1a   # verified, never written
IOSPORT_VBMETA_SHA256=6e614ba7ab223c23548dc65734358f4786d4f4008107695dd9e8b1494791790c   # verified, never written
IOSPORT_ENTRY_METHOD=recovery   # recovery: write+restore | fastboot-boot: RAM only
IOSPORT_DOWNLOAD_RESTORE="RECOVERY only (original image, hash-checked)"   # Download Mode
IOSPORT_LOG_RING=0xC1600000   # Samsung RAM ring (/proc/last_kmsg), warm resets keep it
IOSPORT_LOG_SLOT=0x4000000   # firmware log copy inside the test image (survives cold resets)
IOSPORT_LOG_SLOT_MAGIC=R5QLOGSLOT/V1
IOSPORT_BOOTSHIM_INFO=0x9E300000   # BootShim progress record
IOSPORT_LOADER_PE_BASE=0x99000000
IOSPORT_XNU_WINDOW=0xF4000000+0x180000000   # the kernel window under the full firmware
IOSPORT_RESIDENT_BASE=0xFC000000   # SYSTEM.APF lives here (md0)
IOSPORT_USB_MSD_LABEL=R5QRAM   # the PC copies SYSTEM.APF onto this USB RAM drive
IOSPORT_USB_RAMDISK=0x1A0000000
IOSPORT_SYSTEM_SOURCES="usb-ramdisk sdcard"   # where the firmware may take SYSTEM.APF from
IOSPORT_GIC_VTIMER=19   # the kernel needs gic_vtimer= when not 27
IOSPORT_PANEL=1080x2400
IOSPORT_DSI_RESET_REG=0x118   # DSI 6G registers are shifted by 4
IOSPORT_PANEL_WINDOW="13 2A:00000437 2B:0000095F"   # DCS resent after the DSI reset
IOSPORT_DSI_CMDBUF=0xFF30A000   # the stock bootloader's command DMA buffer
IOSPORT_AUTOREFRESH=0x80000002
IOSPORT_FLIP_BUFFERS="0x9C400000 0x9CE00000 0x9D800000"
